[tool.poetry]
name = "elec5620-backend"
version = "0.1.0"
description = "Study companion backend for ELEC5620 Group 78"
authors = ["Group 78 <team@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.1"
email-validator = "^2.0.0"
sqlalchemy = "^2.0.27"
alembic = "^1.13.1"
aiosqlite = "^0.19.0"
httpx = "^0.27.0"
apscheduler = "^3.10.4"
sentry-sdk = "^1.40.0"
dateparser = "^1.2.0"
rapidfuzz = "^3.6.1"
icalendar = "^5.0.11"
langchain = "^0.1.13"
langchain-openai = "^0.0.8"
python-json-logger = "^2.0.7"
python-dateutil = "^2.9.0.post0"
cachetools = "^5.3.3"
google-api-python-client = "^2.149.0"
google-auth = "^2.36.0"
google-auth-oauthlib = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
freezegun = "^1.4.0"
ruff = "^0.3.0"
mypy = "^1.8.0"
types-dateparser = "^1.2.0.20240126"
httpx = { version = "^0.27.0", extras = ["cli"] }

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
