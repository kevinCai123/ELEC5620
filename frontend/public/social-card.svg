<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="48" fill="#0b0f17"/>
  <rect width="1200" height="630" rx="48" fill="url(#paint0_linear)" fill-opacity="0.55"/>
  <g filter="url(#filter0_f)">
    <ellipse cx="320" cy="180" rx="220" ry="140" fill="#6E7AFF" fill-opacity="0.45"/>
  </g>
  <g filter="url(#filter1_f)">
    <ellipse cx="900" cy="420" rx="260" ry="160" fill="#22d3ee" fill-opacity="0.35"/>
  </g>
  <g filter="url(#filter2_f)">
    <ellipse cx="650" cy="210" rx="200" ry="130" fill="#a855f7" fill-opacity="0.35"/>
  </g>
  <text x="120" y="220" fill="white" font-family="'Inter', 'Segoe UI', sans-serif" font-size="84" font-weight="600">Study Companion</text>
  <text x="120" y="300" fill="#d1d7ff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="32" font-weight="500">Premium AI workspace for smarter uni workflows.</text>
  <rect x="120" y="360" width="340" height="4" rx="2" fill="url(#paint1_linear)"/>
  <text x="120" y="430" fill="#e6edf6" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28">• Summarise readings &amp; emails instantly</text>
  <text x="120" y="480" fill="#e6edf6" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28">• Generate quizzes, travel tips, and smart to-dos</text>
  <text x="120" y="530" fill="#e6edf6" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28">• Glassmorphism UI with animated gradients</text>
  <defs>
    <filter id="filter0_f" x="-40" y="-60" width="720" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="filter1_f" x="440" y="80" width="920" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="filter2_f" x="250" y="-30" width="800" height="480" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <linearGradient id="paint0_linear" x1="120" y1="50" x2="1080" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0f17"/>
      <stop offset="0.52" stop-color="#161c29"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="paint1_linear" x1="120" y1="360" x2="460" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E7AFF"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
