name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Determine Poetry cache directory
        id: poetry-cache-dir
        run: echo "dir=$(poetry config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.poetry-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry lock --no-interaction
          poetry sync --no-interaction

      - name: Check project metadata
        run: poetry check

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Type-check with mypy
        run: poetry run mypy .

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: poetry run pytest

      - name: Build wheel
        run: poetry build
