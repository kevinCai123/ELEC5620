name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Determine Poetry cache directory
        id: poetry-cache-dir
        run: echo "dir=$(poetry config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Poetry cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.poetry-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry lock --no-interaction
          poetry sync --no-interaction

      - name: Check project metadata
        run: poetry check

      - name: Lint with ruff
        run: poetry run ruff check .

      - name: Type-check with mypy
        run: poetry run mypy app tests

      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          OPENAI_API_KEY: test-key
          OPENWEATHER_API_KEY: test-key
        run: |
          poetry run pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=73
      
      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Build wheel
        run: poetry build
